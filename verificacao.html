<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0d1b2a">
    <meta
      http-equiv="refresh"
      content="3;url=https://trabalho.onelink.me/ea02/7i7iil2v"
    >
    <title>Verificando...</title>

    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0d1b2a;
        color: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 30%, rgba(234, 88, 12, 0.09), transparent 34%),
          #0d1b2a;
      }

      .verification {
        width: min(100%, 560px);
        text-align: center;
      }

      .spinner {
        width: 64px;
        height: 64px;
        margin: 0 auto 32px;
        border: 5px solid rgba(255, 255, 255, 0.14);
        border-top-color: #ea580c;
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #ea580c;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 5vw, 2.25rem);
        line-height: 1.15;
        text-wrap: balance;
      }

      p {
        max-width: 440px;
        margin: 16px auto 0;
        color: #b8c3cf;
        font-size: clamp(0.95rem, 2.5vw, 1.05rem);
        line-height: 1.65;
        text-wrap: balance;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 20px;
        }

        .spinner {
          width: 54px;
          height: 54px;
          margin-bottom: 26px;
          border-width: 4px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 1.8s;
        }
      }
    </style>
  </head>

  <body>
    <main class="verification" aria-live="polite">
      <div class="spinner" role="status" aria-label="Verificando"></div>
      <div class="eyebrow">Verificando...</div>
      <h1>Verificação de segurança em andamento</h1>
      <p>Time de atendimento está verificando sua conexão</p>
    </main>

    <script>
      window.setTimeout(function () {
        window.location.replace("https://trabalho.onelink.me/ea02/7i7iil2v");
      }, 3000);
    </script>
  </body>
</html>
